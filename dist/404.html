    <script>
      // Single Page Apps for GitHub Pages
      // Keeps query parameters and routes across GitHub Pages 404
      var l = window.location;
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/index.html' +
        l.search + l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body style="background:#0A0A0C;color:#D4AF37;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">
