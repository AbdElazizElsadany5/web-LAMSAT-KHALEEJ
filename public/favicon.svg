<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="35%" stop-color="#F5C242"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#916F12"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1610"/>
      <stop offset="50%" stop-color="#100E0A"/>
      <stop offset="100%" stop-color="#080705"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Luxury Dark Squircle -->
  <rect width="128" height="128" rx="32" fill="url(#darkBg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.85"/>

  <!-- Stylized Barber Scissors & Crown Logo -->
  <g filter="url(#glow)">
    <!-- Crown at top -->
    <path d="M48 36 L54 44 L64 32 L74 44 L80 36 L78 50 L50 50 Z" fill="url(#gold)"/>
    
    <!-- Crossed Barber Scissors -->
    <!-- Left Loop -->
    <circle cx="44" cy="94" r="10" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
    <!-- Right Loop -->
    <circle cx="84" cy="94" r="10" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
    
    <!-- Left Handle to Right Blade -->
    <path d="M51 86 L64 68 L88 46" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Right Handle to Left Blade -->
    <path d="M77 86 L64 68 L40 46" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Center Pivot Screw -->
    <circle cx="64" cy="68" r="3.5" fill="#100E0A" stroke="url(#gold)" stroke-width="2.5"/>
  </g>
</svg>

